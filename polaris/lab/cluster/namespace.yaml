# Native layer: Pod Security Admission enforces the "restricted" profile
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Used by the demo Deployment (priorityClassName: app-default)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: app-default
value: 1000
globalDefault: false
description: Default priority for demo applications
