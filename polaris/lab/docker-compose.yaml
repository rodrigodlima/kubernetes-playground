services:
  jenkins:
    build: ./jenkins
    image: polaris-lab-jenkins:local
    container_name: polaris-lab-jenkins
    ports:
      - "8080:8080"
    environment:
      KUBECONFIG: /kube/config
    volumes:
      - jenkins_home:/var/jenkins_home
      # z: SELinux label for Podman on Fedora/RHEL; ignored where SELinux is off
      - ./.work/demo-app:/demo-app:ro,z
      - ./.work/kubeconfig:/kube/config:ro,z
    networks:
      - polaris-lab

volumes:
  jenkins_home:

networks:
  # Network created by "minikube start -p polaris-lab" (docker or podman driver)
  polaris-lab:
    external: true
